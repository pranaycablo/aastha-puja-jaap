    <circle cx="250" cy="250" r="172" fill="none" stroke="#D97706" stroke-width="2.5" />
    <path d="M 365.5,202.2 Q 418.0,250.0 365.5,297.8" fill="rgba(254,243,199,0.65)" stroke="#B45309" stroke-width="2" />
