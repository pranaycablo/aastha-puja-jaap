<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="plateGrad" cx="50%" cy="50%" r="55%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#FFF8DB" />
      <stop offset="65%" stop-color="#F5D061" />
      <stop offset="100%" stop-color="#C59B27" />
    </radialGradient>
    <linearGradient id="metalShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.0" />
      <stop offset="55%" stop-color="#000000" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>
    <filter id="yantraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Metal Sacred Plate Background -->
  <rect x="10" y="10" width="480" height="480" rx="32" fill="url(#plateGrad)" stroke="#B38728" stroke-width="6" />
  <rect x="22" y="22" width="456" height="456" rx="24" fill="none" stroke="#8A1807" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.75" />
  <rect x="10" y="10" width="480" height="480" rx="32" fill="url(#metalShine)" pointer-events="none" />

  <!-- Corner Auspicious Symbols -->
  <text x="36" y="52" font-family="'Nirmala UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" fill="#8A1807" text-anchor="middle">卐</text>
  <text x="464" y="52" font-family="'Nirmala UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" fill="#8A1807" text-anchor="middle">ॐ</text>
  <text x="36" y="472" font-family="'Nirmala UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" fill="#8A1807" text-anchor="middle">ॐ</text>
  <text x="464" y="472" font-family="'Nirmala UI', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="bold" fill="#8A1807" text-anchor="middle">卐</text>

