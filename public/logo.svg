<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ultra 24K Polished Metallic Gold Gradient -->
    <linearGradient id="metallicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="20%" stop-color="#FDE047"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Deep Royal Temple Crimson Gradient -->
    <radialGradient id="templeCrimson" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="45%" stop-color="#7F1D1D"/>
      <stop offset="80%" stop-color="#450A0A"/>
      <stop offset="100%" stop-color="#1A0303"/>
    </radialGradient>

    <!-- 3D Gold Bead Gradient with Specular Highlight -->
    <radialGradient id="goldBead" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#5B2206"/>
    </radialGradient>

    <!-- Razor Sharp 3D Drop Shadow -->
    <filter id="crispShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Divine Golden Aura Glow for Central Om -->
    <filter id="omGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.9"/>
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base High-Contrast Canvas: Apple Squircle (rx=116) -->
  <rect width="512" height="512" rx="116" fill="#140202"/>

  <!-- Outer 24K Metallic Gold Border Frame -->
  <rect x="14" y="14" width="484" height="484" rx="104" fill="none" stroke="url(#metallicGold)" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="94" fill="url(#templeCrimson)" stroke="#F59E0B" stroke-width="2" opacity="0.98"/>

  <!-- Sacred Radiant Sunburst Rays (Clean Minimal) -->
  <g opacity="0.16" stroke="#FDE047" stroke-width="2">
    <line x1="256" y1="32" x2="256" y2="480"/>
    <line x1="32" y1="256" x2="480" y2="256"/>
    <line x1="98" y1="98" x2="414" y2="414"/>
    <line x1="98" y1="414" x2="414" y2="98"/>
    <line x1="172" y1="44" x2="340" y2="468"/>
    <line x1="44" y1="172" x2="468" y2="340"/>
  </g>

  <!-- Sacred 24-Bead Rosary Garland Ring (Jaap Mala) -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#metallicGold)" stroke-width="3" stroke-dasharray="6 4" opacity="0.85"/>
  <g filter="url(#crispShadow)">
    <circle cx="256" cy="80" r="14" fill="url(#goldBead)"/>
    <circle cx="302" cy="86" r="12.5" fill="url(#goldBead)"/>
    <circle cx="345" cy="103" r="12.5" fill="url(#goldBead)"/>
    <circle cx="381" cy="131" r="12.5" fill="url(#goldBead)"/>
    <circle cx="409" cy="168" r="12.5" fill="url(#goldBead)"/>
    <circle cx="427" cy="210" r="12.5" fill="url(#goldBead)"/>
    <circle cx="433" cy="256" r="12.5" fill="url(#goldBead)"/>
    <circle cx="427" cy="302" r="12.5" fill="url(#goldBead)"/>
    <circle cx="409" cy="344" r="12.5" fill="url(#goldBead)"/>
    <circle cx="381" cy="381" r="12.5" fill="url(#goldBead)"/>
    <circle cx="345" cy="409" r="12.5" fill="url(#goldBead)"/>
    <circle cx="302" cy="426" r="12.5" fill="url(#goldBead)"/>
    <circle cx="256" cy="432" r="13" fill="url(#goldBead)"/>
    <circle cx="210" cy="426" r="12.5" fill="url(#goldBead)"/>
    <circle cx="167" cy="409" r="12.5" fill="url(#goldBead)"/>
    <circle cx="131" cy="381" r="12.5" fill="url(#goldBead)"/>
    <circle cx="103" cy="344" r="12.5" fill="url(#goldBead)"/>
    <circle cx="85" cy="302" r="12.5" fill="url(#goldBead)"/>
    <circle cx="79" cy="256" r="12.5" fill="url(#goldBead)"/>
    <circle cx="85" cy="210" r="12.5" fill="url(#goldBead)"/>
    <circle cx="103" cy="168" r="12.5" fill="url(#goldBead)"/>
    <circle cx="131" cy="131" r="12.5" fill="url(#goldBead)"/>
    <circle cx="167" cy="103" r="12.5" fill="url(#goldBead)"/>
    <circle cx="210" cy="86" r="12.5" fill="url(#goldBead)"/>
  </g>

  <!-- Sacred Meru Pinnacle Jewel (Crown) -->
  <polygon points="256,54 270,74 242,74" fill="url(#metallicGold)" stroke="#FFFBEB" stroke-width="1.5" filter="url(#crispShadow)"/>
  <circle cx="256" cy="48" r="7" fill="url(#goldBead)" stroke="#F59E0B" stroke-width="1.5"/>

  <!-- Inner Sacred Medallion Sanctum -->
  <circle cx="256" cy="256" r="142" fill="#2E0402" stroke="url(#metallicGold)" stroke-width="4.5" filter="url(#crispShadow)"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="#FDE047" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.9"/>

  <!-- High-Contrast 24K Gold OM (AUM) Calligraphy -->
  <g filter="url(#omGlow)">
    <text x="256" y="324" 
          font-family="'Mukta', 'Rozha One', 'Yatra One', 'Noto Sans Devanagari', 'Kohinoor Devanagari', 'Nirmala UI', 'Arial Unicode MS', sans-serif" 
          font-size="204" 
          font-weight="900" 
          text-anchor="middle" 
          fill="url(#metallicGold)"
          stroke="#3B0703"
          stroke-width="4.5"
          letter-spacing="0">ॐ</text>
  </g>
</svg>
